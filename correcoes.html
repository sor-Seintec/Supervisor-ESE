<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Correções de visitas · Gestor-ESE</title>
  <style>
    :root{--bg:#edf4f7;--panel:#fff;--ink:#15364c;--muted:#617786;--line:#d7e3e9;--dark:#4b86a8;--dark-strong:#245f82;--soft:#dcedf6;--pending:#b56a00;--pending-soft:#fff1d2;--approved:#078356;--approved-soft:#dff6ec;--rejected:#c43d43;--rejected-soft:#fde7e8;--completed:#08ad74;--justified:#3d7cf3;--postponed:#933ce8;--cancelled:#ef4350;--shadow:0 12px 32px rgba(31,65,85,.08)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:radial-gradient(circle at 85% 0,#f8fcfe 0,transparent 32%),var(--bg);color:var(--ink);font:600 14px/1.45 Inter,Segoe UI,sans-serif}.shell{width:min(1460px,100%);margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.title{display:flex;align-items:center;gap:13px}.back{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--dark-strong);cursor:pointer;font-size:19px;box-shadow:0 5px 14px rgba(37,79,103,.06)}.eyebrow{display:block;color:var(--dark);font-size:10px;font-weight:850;letter-spacing:.13em}.title h1{margin:3px 0 0;font-size:27px;letter-spacing:-.03em}.refresh{min-height:42px;padding:0 15px;border:1px solid #c8d9e2;border-radius:11px;background:#fff;color:var(--dark-strong);cursor:pointer;font:800 13px/1 inherit}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.kpi{min-height:108px;padding:17px 19px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow)}.kpi span,.kpi small,.kpi strong{display:block}.kpi span{color:#557080;font-size:10px;font-weight:850;letter-spacing:.055em;text-transform:uppercase}.kpi strong{margin:7px 0 2px;font-size:29px}.kpi small{color:var(--muted);font-size:11px}.kpi.pending{background:var(--dark);border-color:var(--dark);color:#fff}.kpi.pending :is(span,small){color:rgba(255,255,255,.7)}.workspace{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:var(--shadow)}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.workspace-head h2{margin:0;font-size:19px}.workspace-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.search{width:min(390px,100%);min-height:43px;display:flex;align-items:center;gap:9px;padding:0 13px;border:1px solid #cad9e1;border-radius:11px;background:#f8fafb;color:#658091}.search:focus-within{border-color:var(--dark);box-shadow:0 0 0 3px rgba(75,134,168,.13)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:650 13px/1 inherit}.filters{display:flex;gap:7px;padding:12px 20px;border-bottom:1px solid var(--line);background:#f5f8fa;overflow:auto}.filter{min-height:34px;padding:0 12px;border:1px solid #d4e0e6;border-radius:999px;background:#fff;color:#587181;cursor:pointer;font:750 12px/1 inherit;white-space:nowrap}.filter.is-active{border-color:var(--dark);background:var(--dark);color:#fff}.list{display:grid}.request{display:grid;grid-template-columns:minmax(240px,1.2fr) minmax(245px,1fr) minmax(260px,1.2fr) auto;gap:18px;align-items:center;padding:17px 20px;border-bottom:1px solid #e6edf1}.request:last-child{border-bottom:0}.request:hover{background:#f9fbfc}.request-main strong,.request-main span,.request-main small{display:block}.request-main strong{font-size:14px}.request-main span{margin-top:3px;color:#486879;font-size:12px}.request-main small{margin-top:3px;color:#80929d;font-size:10.5px}.status-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--status) 12%,#fff);color:var(--status);font-size:11px;font-weight:850}.status i{width:18px;height:18px;display:grid;place-items:center;border-radius:5px;background:var(--status);color:#fff;font-style:normal;font-size:9px}.arrow{color:#8295a0;font-weight:900}.reason{color:#456171;font-size:12px;line-height:1.55}.reason strong{display:block;margin-bottom:3px;color:#25495f;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.review-state{display:inline-flex;align-items:center;justify-content:center;min-width:95px;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.review-state.pending{background:var(--pending-soft);color:var(--pending)}.review-state.approved{background:var(--approved-soft);color:var(--approved)}.review-state.rejected{background:var(--rejected-soft);color:var(--rejected)}.request-actions{display:flex;gap:7px;margin-top:8px}.request-actions button{min-height:34px;padding:0 11px;border-radius:9px;cursor:pointer;font:800 11px/1 inherit}.approve{border:0;background:var(--approved);color:#fff}.reject{border:1px solid #edb6b9;background:#fff;color:var(--rejected)}.empty{padding:55px 22px;color:var(--muted);text-align:center}.foot{padding:12px 20px;background:#f8fafb;color:#6b808d;font-size:11px}.loading[hidden],.review-modal[hidden]{display:none}.loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(237,244,247,.78);backdrop-filter:blur(3px)}.loading-card{padding:20px 26px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}.review-modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(15,43,59,.56);backdrop-filter:blur(4px)}.review-dialog{width:min(520px,100%);overflow:hidden;border-radius:17px;background:#fff;box-shadow:0 28px 70px rgba(12,35,51,.3)}.review-head{display:flex;align-items:flex-start;justify-content:space-between;padding:21px 23px 16px;border-bottom:1px solid var(--line)}.review-head h2{margin:0;font-size:21px}.review-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.close{width:34px;height:34px;border:0;border-radius:10px;background:#edf3f6;color:#4b6575;cursor:pointer;font-size:20px}.review-body{display:grid;gap:13px;padding:18px 23px}.review-summary{padding:13px;border-radius:11px;background:#f3f8fa;color:#36576a;font-size:12px}.review-body label{font-size:12px;font-weight:800}.review-body textarea{width:100%;min-height:90px;margin-top:6px;padding:11px;border:1px solid #c9dae3;border-radius:10px;outline:0;resize:vertical;font:600 13px/1.5 inherit}.review-body textarea:focus{border-color:var(--dark);box-shadow:0 0 0 3px rgba(75,134,168,.13)}.review-actions{display:flex;justify-content:flex-end;gap:9px;padding:15px 23px 20px;border-top:1px solid var(--line)}.review-actions button{min-height:40px;padding:0 15px;border-radius:10px;cursor:pointer;font:800 12px/1 inherit}.review-cancel{border:1px solid #cad9e1;background:#fff;color:#416074}.review-confirm{border:0;color:#fff}.review-confirm.approved{background:var(--approved)}.review-confirm.rejected{background:var(--rejected)}.message{margin:0;color:var(--rejected);font-size:12px;font-weight:750}
    .delete-request{display:block;margin-top:8px;padding:0;border:0;background:transparent;color:var(--rejected);cursor:pointer;font:750 10.5px/1.3 inherit;text-decoration:underline;text-underline-offset:3px}.delete-request:hover{color:#8f2026}.delete-request:focus-visible{outline:2px solid var(--rejected);outline-offset:3px;border-radius:3px}
    @media(max-width:920px){.shell{padding:15px}.kpis{grid-template-columns:1fr 1fr 1fr}.workspace-head{align-items:stretch;flex-direction:column}.search{width:100%}.request{grid-template-columns:1fr 1fr}.request-review{grid-column:2}}
    @media(max-width:600px){.kpis{grid-template-columns:1fr}.request{grid-template-columns:1fr}.request-review{grid-column:auto}.topbar{align-items:flex-start}.title h1{font-size:23px}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="loading-card">Atualizando solicitações…</div></div>
  <main class="shell">
    <header class="topbar">
      <div class="title"><button class="back" id="backButton" type="button" aria-label="Voltar à visão geral">←</button><div><span class="eyebrow">GESTÃO 360°</span><h1>Correções de visitas</h1></div></div>
      <button class="refresh" id="refreshButton" type="button">↻ Atualizar</button>
    </header>
    <section class="kpis" aria-label="Resumo das solicitações">
      <article class="kpi pending"><span>Aguardando análise</span><strong id="pendingCount">—</strong><small>status original ainda preservado</small></article>
      <article class="kpi"><span>Aprovadas</span><strong id="approvedCount">—</strong><small>visitas e agenda corrigidas</small></article>
      <article class="kpi"><span>Rejeitadas</span><strong id="rejectedCount">—</strong><small>status original mantido</small></article>
    </section>
    <section class="workspace">
      <header class="workspace-head"><div><h2>Solicitações registradas</h2><p>Analise o motivo antes de alterar os indicadores.</p></div><label class="search">⌕<input id="searchInput" type="search" placeholder="Supervisor, escola ou motivo…"></label></header>
      <div class="filters"><button class="filter is-active" data-filter="pending">Pendentes</button><button class="filter" data-filter="all">Todas</button><button class="filter" data-filter="approved">Aprovadas</button><button class="filter" data-filter="rejected">Rejeitadas</button></div>
      <div class="list" id="requestList"></div>
      <footer class="foot" id="resultCount">0 solicitações</footer>
    </section>
  </main>
  <div class="review-modal" id="reviewModal" hidden>
    <section class="review-dialog" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
      <header class="review-head"><div><h2 id="reviewTitle">Analisar correção</h2><p id="reviewSubtitle"></p></div><button class="close" id="reviewClose" type="button" aria-label="Fechar">×</button></header>
      <form id="reviewForm">
        <div class="review-body"><div class="review-summary" id="reviewSummary"></div><label>Observação da gestão<textarea id="reviewNote" maxlength="800" placeholder="Opcional na aprovação; obrigatória na rejeição."></textarea></label><p class="message" id="reviewMessage"></p></div>
        <footer class="review-actions"><button class="review-cancel" id="reviewCancel" type="button">Cancelar</button><button class="review-confirm" id="reviewConfirm" type="submit">Confirmar</button></footer>
      </form>
    </section>
  </div>
  <script type="module">
    import{auth,deleteVisitCorrectionRequest,loadVisitCorrectionRequests,requireAdmin,requireMasterAdmin,reviewVisitCorrectionRequest}from'./firebase-gestor.js';
    const $=id=>document.getElementById(id),fold=value=>(value??'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const labels={completed:{label:'Visitada',code:'V',color:'var(--completed)'},justified:{label:'Justificada',code:'J',color:'var(--justified)'},postponed:{label:'Adiada',code:'A',color:'var(--postponed)'},cancelled:{label:'Cancelada',code:'C',color:'var(--cancelled)'}};
    const reviewLabels={pending:'Pendente',approved:'Aprovada',rejected:'Rejeitada'};
    let requests=[],activeFilter='pending',reviewing=null,decision='approved',canDeleteRequests=false;
    const dateValue=value=>value?.toDate?.()||null;
    const formatDate=value=>{const date=dateValue(value);return date?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(date):'Data não informada'};
    const visitDate=value=>{const date=dateValue(value);return date?new Intl.DateTimeFormat('pt-BR').format(date):'—'};
    function statusElement(code){const meta=labels[code]||{label:code||'Não informado',code:'?',color:'var(--dark)'};const span=document.createElement('span');span.className='status';span.style.setProperty('--status',meta.color);span.innerHTML='<i></i><b></b>';span.querySelector('i').textContent=meta.code;span.querySelector('b').textContent=meta.label;return span}
    function updateKpis(){$('pendingCount').textContent=requests.filter(item=>item.reviewStatus==='pending').length;$('approvedCount').textContent=requests.filter(item=>item.reviewStatus==='approved').length;$('rejectedCount').textContent=requests.filter(item=>item.reviewStatus==='rejected').length}
    function render(){const term=fold($('searchInput').value),visible=requests.filter(item=>(activeFilter==='all'||item.reviewStatus===activeFilter)&&(!term||fold(`${item.supervisorName} ${item.schoolName} ${item.reason} ${item.requestedByEmail}`).includes(term))).sort((a,b)=>Number(b.reviewStatus==='pending')-Number(a.reviewStatus==='pending')||((dateValue(b.requestedAt)?.getTime()||0)-(dateValue(a.requestedAt)?.getTime()||0)));const list=$('requestList');list.replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Nenhuma solicitação encontrada para este filtro.';list.appendChild(empty)}visible.forEach(item=>{const row=document.createElement('article');row.className='request';const main=document.createElement('div');main.className='request-main';main.innerHTML='<strong></strong><span></span><small></small>';main.querySelector('strong').textContent=item.schoolName||'Escola não informada';main.querySelector('span').textContent=item.supervisorName||item.supervisorId||'Supervisor não informado';main.querySelector('small').textContent=`Visita: ${visitDate(item.visitDate)} · Solicitada: ${formatDate(item.requestedAt)}`;const flow=document.createElement('div');flow.className='status-flow';flow.append(statusElement(item.previousStatusCode));const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';flow.append(arrow,statusElement(item.requestedStatusCode));const reason=document.createElement('div');reason.className='reason';reason.innerHTML='<strong>Motivo informado</strong><span></span>';reason.querySelector('span').textContent=item.reason||'Sem motivo informado.';const review=document.createElement('div');review.className='request-review';const state=document.createElement('span');state.className=`review-state ${item.reviewStatus||'pending'}`;state.textContent=reviewLabels[item.reviewStatus]||item.reviewStatus;review.appendChild(state);if(item.reviewStatus==='pending'){const actions=document.createElement('div');actions.className='request-actions';const approve=document.createElement('button');approve.type='button';approve.className='approve';approve.textContent='Aprovar';approve.addEventListener('click',()=>openReview(item,'approved'));const reject=document.createElement('button');reject.type='button';reject.className='reject';reject.textContent='Rejeitar';reject.addEventListener('click',()=>openReview(item,'rejected'));actions.append(approve,reject);review.appendChild(actions)}else if(item.reviewerNote){const note=document.createElement('small');note.style.cssText='display:block;margin-top:7px;color:#6b808d;max-width:180px';note.textContent=item.reviewerNote;review.appendChild(note)}if(canDeleteRequests){const remove=document.createElement('button');remove.type='button';remove.className='delete-request';remove.textContent=item.reviewStatus==='pending'?'Cancelar e excluir teste':'Excluir histórico de teste';remove.addEventListener('click',()=>removeCorrection(item));review.appendChild(remove)}row.append(main,flow,reason,review);list.appendChild(row)});$('resultCount').textContent=`${visible.length} ${visible.length===1?'solicitação':'solicitações'}`}
    async function removeCorrection(item){const pending=item.reviewStatus==='pending';const warning=pending?'A solicitação pendente será cancelada e o status atual da visita será mantido.':'Somente o histórico da solicitação será removido. O status já aplicado à visita não será desfeito.';if(!confirm(`REMOVER SOLICITAÇÃO DE TESTE\n\n${item.schoolName||'Escola não informada'}\n${warning}\n\nDeseja continuar?`))return;try{$('loading').hidden=false;await deleteVisitCorrectionRequest(item.id);await load()}catch(error){console.error(error);alert(error?.code==='access/master-required'?'Somente o Administrador Master pode excluir esse histórico.':'Não foi possível excluir a solicitação.')}finally{$('loading').hidden=true}}
    function openReview(item,nextDecision){reviewing=item;decision=nextDecision;$('reviewTitle').textContent=nextDecision==='approved'?'Aprovar correção':'Rejeitar correção';$('reviewSubtitle').textContent=`${item.supervisorName||item.supervisorId} · ${item.schoolName}`;$('reviewSummary').textContent=`${labels[item.previousStatusCode]?.label||item.previousStatusCode} → ${labels[item.requestedStatusCode]?.label||item.requestedStatusCode}. Motivo: ${item.reason}`;$('reviewNote').value='';$('reviewMessage').textContent='';const confirm=$('reviewConfirm');confirm.className=`review-confirm ${nextDecision}`;confirm.textContent=nextDecision==='approved'?'Aprovar e atualizar status':'Rejeitar solicitação';$('reviewModal').hidden=false;$('reviewNote').focus()}
    function closeReview(){$('reviewModal').hidden=true;reviewing=null;$('reviewMessage').textContent=''}
    function reviewErrorMessage(error){
      const messages={
        'permission-denied':'O Firestore bloqueou a aprovação. Publique o arquivo firestore.rules atualizado no Firebase e tente novamente.',
        'resource-exhausted':'O Firebase atingiu um limite temporário de uso. A solicitação continua pendente; consulte Firestore → Uso antes de tentar novamente.',
        'unavailable':'O Firebase está temporariamente indisponível. Verifique a conexão e tente novamente.',
        'aborted':'A análise encontrou outra atualização simultânea. Atualize a página e tente novamente.',
        'data/correction-already-reviewed':'Esta solicitação já foi analisada. Atualize a página.',
        'data/correction-not-found':'A solicitação não existe mais. Atualize a página.',
        'data/visit-not-found':'A visita vinculada a esta solicitação não foi encontrada.',
        'data/invalid-requested-status':'O novo status solicitado não é válido.'
      };
      return messages[error?.code]||`Não foi possível concluir a análise${error?.code?` (${error.code})`:''}.`;
    }
    async function load(){$('loading').hidden=false;try{await requireAdmin();try{await requireMasterAdmin();canDeleteRequests=true}catch{canDeleteRequests=false}requests=await loadVisitCorrectionRequests();updateKpis();render()}catch(error){console.error(error);requests=[];updateKpis();render();const empty=$('requestList').querySelector('.empty');if(empty)empty.textContent=error?.code==='permission-denied'?'Publique as regras atualizadas do Firestore para consultar as correções.':'Não foi possível carregar as solicitações.'}finally{$('loading').hidden=true}}
    $('reviewForm').addEventListener('submit',async event=>{event.preventDefault();if(!reviewing)return;const note=$('reviewNote').value.trim();if(decision==='rejected'&&note.length<5){$('reviewMessage').textContent='Informe o motivo da rejeição com pelo menos 5 caracteres.';return}const button=$('reviewConfirm');button.disabled=true;button.textContent='Processando…';try{await reviewVisitCorrectionRequest(reviewing.id,decision,note);closeReview();await load()}catch(error){console.error('Falha ao analisar correção:',error?.code,error?.message,error);$('reviewMessage').textContent=reviewErrorMessage(error)}finally{button.disabled=false;button.textContent=decision==='approved'?'Aprovar e atualizar status':'Rejeitar solicitação'}});
    $('searchInput').addEventListener('input',render);$('refreshButton').addEventListener('click',load);document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(item=>item.classList.remove('is-active'));button.classList.add('is-active');activeFilter=button.dataset.filter;render()}));$('reviewClose').addEventListener('click',closeReview);$('reviewCancel').addEventListener('click',closeReview);$('reviewModal').addEventListener('click',event=>{if(event.target.id==='reviewModal')closeReview()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('reviewModal').hidden)closeReview()});$('backButton').addEventListener('click',()=>{if(window.parent!==window&&window.parent.portalNavigate)window.parent.portalNavigate('home');else location.href='index.html'});
    try{await load()}catch(error){if(!auth.currentUser)location.href='index.html'}
  </script>
</body>
</html>
